version: '3.8'

services:
  app:
    build: .
    container_name: db_app
    restart: always
    volumes:
      - ./app:/var/www/html
    ports:
      - "9000:9000"
    depends_on:
      - db
    networks:
      - db_network

  db:
    image: mysql:8.0
    container_name: db_mysql
    command: --default-authentication-plugin=mysql_native_password --sql_mode=""
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      UPLOAD_LIMIT: 1024M
    ports:
      - "3307:3306"
    volumes:
      - ./db_data/mysql:/var/lib/mysql
      - ./db_data/sqlite:/var/lib/sqlite
    networks:
      - db_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: db_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      APACHE_AUTH_TYPE: Basic
      APACHE_AUTH_USER: admin
      APACHE_AUTH_PASS: admin
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - db_network

volumes:
  db_data:

networks:
  db_network:
    driver: bridge 